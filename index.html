<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Arcade</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d1a;
    --surface: #13132a;
    --card: #1a1a35;
    --card-hover: #22224a;
    --accent: #7c4dff;
    --accent2: #00e5ff;
    --text: #e0e0ff;
    --muted: #8888aa;
    --border: #2a2a55;
    --cat-action: #ff4d6d;
    --cat-platformer: #ff9a3c;
    --cat-puzzle: #ffd700;
    --cat-racing: #00e5ff;
    --cat-shooting: #ff4d4d;
    --cat-sports: #4cff91;
    --cat-strategy: #b97cff;
    --cat-simulation: #ff79c6;
    --cat-horror: #ff2e63;
    --cat-io: #00ffcc;
    --cat-idle: #ffb347;
    --cat-minecraft: #6dcd4f;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #1a0533 0%, #0d1a3a 100%);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }

  .logo {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo span { font-size: 1.8rem; }

  .search-bar {
    width: 100%;
    max-width: 520px;
    position: relative;
  }

  .search-bar input {
    width: 100%;
    padding: 12px 20px 12px 44px;
    border-radius: 999px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1.1rem;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 900px;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .stats {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 12px 32px 0;
  }

  main {
    padding: 24px 32px 48px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
    margin-top: 4px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 14px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 60%, rgba(124,77,255,0.07));
    pointer-events: none;
  }

  .card:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(124,77,255,0.2);
  }

  .card-icon {
    font-size: 2.4rem;
    line-height: 1;
  }

  .card-name {
    font-size: 0.88rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    color: var(--text);
  }

  .cat-badge {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 9px;
    border-radius: 999px;
    opacity: 0.85;
  }

  .cat-action   { background: var(--cat-action);   color: #000; }
  .cat-platformer { background: var(--cat-platformer); color: #000; }
  .cat-puzzle   { background: var(--cat-puzzle);   color: #000; }
  .cat-racing   { background: var(--cat-racing);   color: #000; }
  .cat-shooting { background: var(--cat-shooting); color: #fff; }
  .cat-sports   { background: var(--cat-sports);   color: #000; }
  .cat-strategy { background: var(--cat-strategy); color: #000; }
  .cat-simulation { background: var(--cat-simulation); color: #000; }
  .cat-horror   { background: var(--cat-horror);   color: #fff; }
  .cat-io       { background: var(--cat-io);       color: #000; }
  .cat-idle     { background: var(--cat-idle);     color: #000; }
  .cat-minecraft { background: var(--cat-minecraft); color: #000; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 1.1rem;
  }

  /* Modal overlay */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000;
    flex-direction: column;
  }

  .modal.open { display: flex; }

  .modal-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: #111;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .modal-title {
    flex: 1;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .modal-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .modal-btn:hover { background: var(--card-hover); }
  .modal-btn.close-btn { background: #3a0000; border-color: #700; }
  .modal-btn.close-btn:hover { background: #5a0000; }

  .modal-btn.fullscreen-btn { background: #001a3a; border-color: #007; }
  .modal-btn.fullscreen-btn:hover { background: #002a5a; }

  .modal-frame-wrap {
    flex: 1;
    position: relative;
    background: #000;
  }

  .modal-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .modal-loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #000;
    color: var(--muted);
    font-size: 1rem;
    transition: opacity 0.3s;
  }

  .modal-loading.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-bar-wrap {
    width: 220px;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    display: none;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 999px;
    width: 0%;
    transition: width 0.2s;
  }

  .loading-label {
    font-size: 0.9rem;
    color: var(--muted);
  }

  .open-tab-btn {
    margin-top: 4px;
    padding: 8px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }

  .open-tab-btn:hover { background: #6a3de8; }

  @media (max-width: 600px) {
    header { padding: 16px; }
    main { padding: 16px 12px 40px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .logo { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>🎮</span> Game Arcade</div>
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search games..." autocomplete="off" />
  </div>
  <div class="filters" id="filters"></div>
</header>

<p class="stats" id="stats"></p>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="modal">
  <div class="modal-bar">
    <button class="modal-btn close-btn" onclick="closeGame()">✕ Back</button>
    <div class="modal-title" id="modal-title"></div>
    <button class="modal-btn fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>
  <div class="modal-frame-wrap" id="modal-frame-wrap">
    <div class="modal-loading" id="modal-loading">
      <div class="spinner" id="modal-spinner"></div>
      <div class="loading-label" id="loading-label">Loading game…</div>
      <button class="open-tab-btn" id="open-tab-btn">Open in New Tab Instead</button>
    </div>
    <iframe id="game-frame" allowfullscreen></iframe>
  </div>
</div>

const CAT_ICONS = {
  action: "⚔️", platformer: "🏃", puzzle: "🧩", racing: "🏎️",
  shooting: "🔫", sports: "⚽", strategy: "🏰", simulation: "🎭",
  horror: "👻", io: "🌐", idle: "💰", minecraft: "⛏️"
};

const CAT_LABELS = {
  action: "Action", platformer: "Platformer", puzzle: "Puzzle", racing: "Racing",
  shooting: "Shooting", sports: "Sports", strategy: "Strategy", simulation: "Simulation",
  horror: "Horror", io: ".io Games", idle: "Idle/Clicker", minecraft: "Minecraft"
};

const cats = ["all", ...Object.keys(CAT_LABELS)];
let activeFilter = "all";
let searchQuery = "";

const filtersEl = document.getElementById("filters");
const gridEl = document.getElementById("grid");
const statsEl = document.getElementById("stats");

cats.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "filter-btn" + (cat === "all" ? " active" : "");
  btn.textContent = cat === "all" ? "All Games" : (CAT_ICONS[cat] || "") + " " + CAT_LABELS[cat];
  btn.dataset.cat = cat;
  btn.addEventListener("click", () => {
    activeFilter = cat;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
  filtersEl.appendChild(btn);
});

document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value.toLowerCase();
  render();
});

let filteredGames = [];

function render() {
  filteredGames = GAMES.filter(g => {
    const matchCat = activeFilter === "all" || g.cat === activeFilter;
    const matchSearch = !searchQuery || g.name.toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  });

  statsEl.textContent = `${filteredGames.length} game${filteredGames.length !== 1 ? "s" : ""} found`;

  if (filteredGames.length === 0) {
    gridEl.innerHTML = '<div class="empty">No games found. Try a different search!</div>';
    return;
  }

  gridEl.innerHTML = filteredGames.map((g, i) => `
    <div class="card" data-idx="${i}">
      <div class="card-icon">${CAT_ICONS[g.cat] || "🎮"}</div>
      <div class="card-name">${g.name}</div>
      <span class="cat-badge cat-${g.cat}">${CAT_LABELS[g.cat] || g.cat}</span>
    </div>
  `).join("");
}

gridEl.addEventListener("click", e => {
  const card = e.target.closest(".card[data-idx]");
  if (!card) return;
  const g = filteredGames[card.dataset.idx];
  if (g) openGame(g.name, g.url, g.cat);
});

const modal = document.getElementById("modal");
const gameFrame = document.getElementById("game-frame");
const modalTitle = document.getElementById("modal-title");
const modalLoading = document.getElementById("modal-loading");
const loadingLabel = document.getElementById("loading-label");
const openTabBtn = document.getElementById("open-tab-btn");
const modalSpinner = document.getElementById("modal-spinner");
let currentBlobUrl = null;
let currentGameUrl = null;

openTabBtn.addEventListener("click", () => {
  window.open(currentGameUrl, "_blank");
  closeGame();
});

async function openGame(name, url, cat) {
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  modalTitle.textContent = (CAT_ICONS[cat] || "🎮") + "  " + name;
  currentGameUrl = url;

  // Reset loading UI
  modalLoading.classList.remove("hidden");
  modalSpinner.style.display = "";
  loadingLabel.textContent = "Loading game…";
  loadingLabel.style.color = "";
  openTabBtn.style.display = "none";
  gameFrame.src = "";
  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const html = await res.text();
    const blob = new Blob([html], { type: "text/html" });
    currentBlobUrl = URL.createObjectURL(blob);
    gameFrame.onload = () => modalLoading.classList.add("hidden");
    gameFrame.src = currentBlobUrl;
  } catch (err) {
    console.error("Game load error:", err);
    modalSpinner.style.display = "none";
    loadingLabel.style.color = "#ff6b6b";
    loadingLabel.textContent = `Failed to load (${err.message}) — try opening in a new tab instead.`;
    openTabBtn.style.display = "";
  }
}

function closeGame() {
  modal.classList.remove("open");
  gameFrame.src = "";
  document.body.style.overflow = "";
}

function toggleFullscreen() {
  const wrap = document.getElementById("modal-frame-wrap");
  if (!document.fullscreenElement) {
    wrap.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modal.classList.contains("open")) closeGame();
});

render();
