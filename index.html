<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Arcade</title>
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-gZgLLvIgIbzfbPdjNMncK.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d1a;
    --surface: #13132a;
    --card: #1a1a35;
    --card-hover: #22224a;
    --accent: #7c4dff;
    --accent2: #00e5ff;
    --text: #e0e0ff;
    --muted: #8888aa;
    --border: #2a2a55;
    --cat-action: #ff4d6d;
    --cat-platformer: #ff9a3c;
    --cat-puzzle: #ffd700;
    --cat-racing: #00e5ff;
    --cat-shooting: #ff4d4d;
    --cat-sports: #4cff91;
    --cat-strategy: #b97cff;
    --cat-simulation: #ff79c6;
    --cat-horror: #ff2e63;
    --cat-io: #00ffcc;
    --cat-idle: #ffb347;
    --cat-minecraft: #6dcd4f;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #1a0533 0%, #0d1a3a 100%);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }

  .logo {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo span { font-size: 1.8rem; }

  .search-bar {
    width: 100%;
    max-width: 520px;
    position: relative;
  }

  .search-bar input {
    width: 100%;
    padding: 12px 20px 12px 44px;
    border-radius: 999px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1.1rem;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 900px;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .stats {
    color: var(--muted);
    font-size: 0.85rem;
  }

  main {
    padding: 16px 24px 48px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
    margin-top: 4px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    color: inherit;
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(124,77,255,0.25);
  }

  .card.kb-focused {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(0,229,255,0.3);
    transform: translateY(-3px);
  }

  .card-thumb {
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .card-info {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .card-name {
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    color: var(--text);
  }

  .cat-badge {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 9px;
    border-radius: 999px;
    opacity: 0.85;
  }

  .cat-action   { background: var(--cat-action);   color: #000; }
  .cat-platformer { background: var(--cat-platformer); color: #000; }
  .cat-puzzle   { background: var(--cat-puzzle);   color: #000; }
  .cat-racing   { background: var(--cat-racing);   color: #000; }
  .cat-shooting { background: var(--cat-shooting); color: #fff; }
  .cat-sports   { background: var(--cat-sports);   color: #000; }
  .cat-strategy { background: var(--cat-strategy); color: #000; }
  .cat-simulation { background: var(--cat-simulation); color: #000; }
  .cat-horror   { background: var(--cat-horror);   color: #fff; }
  .cat-io       { background: var(--cat-io);       color: #000; }
  .cat-idle     { background: var(--cat-idle);     color: #000; }
  .cat-minecraft { background: var(--cat-minecraft); color: #000; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 1.1rem;
  }

  /* ── Light mode ── */
  body.light {
    --bg: #f2f2ff;
    --surface: #e8e8f8;
    --card: #ffffff;
    --card-hover: #ededff;
    --text: #1a1a35;
    --muted: #5555aa;
    --border: #ccccee;
  }

  body.light header {
    background: linear-gradient(135deg, #d8b4fe 0%, #a5f3fc 100%);
  }

  body.light .ad-slot,
  body.light .ad-banner-mobile { background: #e8e8f8; border-color: #aaaacc; }

  .chat-btn {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff;
    text-decoration: none;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  .chat-btn:hover { opacity: 0.85; }

  .theme-btn {
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    border-radius: 50%;
    width: 38px; height: 38px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: background 0.15s;
    line-height: 1;
  }

  body.light .theme-btn { background: rgba(0,0,0,0.1); border-color: rgba(0,0,0,0.2); color: #333; }
  .theme-btn:hover { background: rgba(255,255,255,0.3); }

  /* ── Featured section ── */
  .featured-wrap { padding: 16px 24px 0; }

  .featured-row {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .featured-card {
    flex-shrink: 0;
    width: 130px;
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .featured-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(124,77,255,0.35);
    border-color: var(--accent2);
  }

  .featured-badge {
    position: absolute;
    top: 6px; left: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 0.6rem;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    z-index: 1;
  }

  .featured-card .card-thumb { height: 80px; font-size: 2.4rem; }
  .featured-card .card-info  { padding: 7px 8px 9px; }
  .featured-card .card-name  { font-size: 0.78rem; }

  /* ── Modal overlay */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000;
    flex-direction: column;
  }

  .modal.open { display: flex; }

  .modal-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: #111;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .modal-title {
    flex: 1;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .modal-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .modal-btn:hover { background: var(--card-hover); }
  .modal-btn.close-btn { background: #3a0000; border-color: #700; }
  .modal-btn.close-btn:hover { background: #5a0000; }

  .modal-btn.fullscreen-btn { background: #001a3a; border-color: #007; }
  .modal-btn.fullscreen-btn:hover { background: #002a5a; }

  .modal-frame-wrap {
    flex: 1;
    position: relative;
    background: #000;
  }

  .modal-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .modal-loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #000;
    color: var(--muted);
    font-size: 1rem;
    transition: opacity 0.3s;
  }

  .modal-loading.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-bar-wrap {
    width: 220px;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    display: none;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 999px;
    width: 0%;
    transition: width 0.2s;
  }

  .loading-label {
    font-size: 0.9rem;
    color: var(--muted);
  }

  .open-tab-btn {
    margin-top: 4px;
    padding: 8px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }

  .open-tab-btn:hover { background: #6a3de8; }

  /* ── Page layout ── */
  .page-layout {
    display: grid;
    grid-template-columns: 180px 1fr 180px;
    max-width: 1800px;
    margin: 0 auto;
    align-items: start;
  }

  .page-center { min-width: 0; }

  /* ── Ad sidebars ── */
  .ad-sidebar {
    padding: 20px 10px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: sticky;
    top: 130px;
  }

  .ad-slot {
    background: #0e0e20;
    border: 1.5px dashed #33335a;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #44446a;
  }

  .ad-slot-rect { width: 160px; height: 160px; }
  .ad-slot-sky  { width: 160px; height: 420px; }
  .ad-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .ad-icon  { font-size: 1.4rem; opacity: 0.3; }

  .ad-banner-mobile {
    display: none;
    background: #0e0e20;
    border: 1.5px dashed #33335a;
    border-radius: 10px;
    height: 80px;
    margin: 12px 16px;
    align-items: center;
    justify-content: center;
    color: #44446a;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    gap: 8px;
  }

  /* ── Stats bar + sort ── */
  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px 0;
  }

  .sort-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.82rem;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    outline: none;
  }

  /* ── Recently played ── */
  .recently-played-wrap { padding: 16px 24px 0; }

  .section-title {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .recently-played {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .recent-card {
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    min-width: 110px;
    transition: all 0.15s;
  }

  .recent-card:hover { border-color: var(--accent); background: var(--card-hover); }
  .recent-card .card-name { font-size: 0.76rem; }

  /* ── Play overlay (inside .card-thumb) ── */
  .play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(80,30,180,0.82);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.18s;
    pointer-events: none;
  }

  .card:hover .play-overlay { opacity: 1; }

  /* ── Favorites button ── */
  .fav-btn {
    position: absolute;
    top: 6px; right: 6px;
    background: rgba(0,0,0,0.45);
    border: none;
    font-size: 0.95rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, transform 0.1s;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 6px;
    z-index: 3;
  }

  .card:hover .fav-btn { opacity: 1; }
  .card.favorited .fav-btn { opacity: 1; }
  .fav-btn:hover { transform: scale(1.2); }

  /* ── Share button ── */
  .modal-btn.share-btn { background: #003828; border-color: #006848; }
  .modal-btn.share-btn:hover { background: #004838; }

  /* ── Footer ── */
  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 24px;
  }

  footer a { color: var(--accent2); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .page-layout { grid-template-columns: 1fr; }
    .ad-sidebar { display: none; }
    .ad-banner-mobile { display: flex; }
  }

  @media (max-width: 600px) {
    header { padding: 16px; }
    main { padding: 12px 10px 40px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .logo { font-size: 1.6rem; }
    .stats-bar { padding: 10px 12px 0; }
    .recently-played-wrap { padding: 12px 12px 0; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>🎮</span> Game Arcade</div>
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search games... (or press /)" autocomplete="off" />
  </div>
  <div class="filters" id="filters"></div>
  <a class="chat-btn" id="chat-btn" href="https://quizlyedition.netlify.app" target="_blank" rel="noopener">💬 Chat</a>
  <button class="theme-btn" id="theme-btn" title="Toggle light/dark mode">🌙</button>
</header>

<div class="page-layout">

  <aside class="ad-sidebar">
    <div class="ad-slot ad-slot-rect"><span class="ad-icon">📢</span><span class="ad-label">Advertisement</span></div>
    <div class="ad-slot ad-slot-sky"><span class="ad-icon">📢</span><span class="ad-label">Advertisement</span></div>
  </aside>

  <div class="page-center">
    <div class="ad-banner-mobile"><span>📢</span>&nbsp;Advertisement</div>

    <div class="stats-bar">
      <p class="stats" id="stats"></p>
      <select class="sort-select" id="sort-select">
        <option value="default">Sort: Default</option>
        <option value="az">Sort: A–Z</option>
        <option value="za">Sort: Z–A</option>
      </select>
    </div>

    <div class="featured-wrap" id="featured-wrap">
      <div class="section-title">⭐ Featured Games</div>
      <div class="featured-row" id="featured-row"></div>
    </div>

    <div class="recently-played-wrap" id="recently-played-wrap" style="display:none">
      <div class="section-title">🕹️ Recently Played</div>
      <div class="recently-played" id="recently-played"></div>
    </div>

    <main>
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <aside class="ad-sidebar">
    <div class="ad-slot ad-slot-rect"><span class="ad-icon">📢</span><span class="ad-label">Advertisement</span></div>
    <div class="ad-slot ad-slot-sky"><span class="ad-icon">📢</span><span class="ad-label">Advertisement</span></div>
  </aside>

</div>

<footer>
  <span>🎮 Game Arcade &mdash; 300+ free games</span>
  <a href="https://github.com/CoolDude2349/Offline-HTML-Games-Pack" target="_blank" rel="noopener">Games Source ↗</a>
</footer>

<div class="modal" id="modal">
  <div class="modal-bar">
    <button class="modal-btn close-btn" onclick="closeGame()">✕ Back</button>
    <div class="modal-title" id="modal-title"></div>
    <button class="modal-btn share-btn" id="share-btn">🔗 Share</button>
    <button class="modal-btn fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>
  <div class="modal-frame-wrap" id="modal-frame-wrap">
    <div class="modal-loading" id="modal-loading">
      <div class="spinner" id="modal-spinner"></div>
      <div class="loading-label" id="loading-label">Loading game…</div>
      <button class="open-tab-btn" id="open-tab-btn">Open in New Tab Instead</button>
    </div>
    <iframe id="game-frame" allowfullscreen></iframe>
  </div>
</div>

<script>
const GAMES = [
  { name: "Minecraft 1.12", cat: "minecraft", url: "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/1.12.html" },
  { name: "Minecraft 1.5", cat: "minecraft", url: "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/1.5.html" },
  { name: "Minecraft 1.8", cat: "minecraft", url: "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/1.8.html" },
  { name: "10 Minutes Till Dawn", cat: "shooting", url: "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/10minutestilldawn.html" },
  { name: "12 Mini Battles", cat: "action", url: "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/12minibattles.html" },
  { name: "1 on 1 Soccer", cat: "sports", url: "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/1on1soccer.html" },
  { name: "1 on 1 Tennis", cat: "sports", url: "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/1on1tennis.html" },
  { name: "1v1.lol", cat: "shooting", url: "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/1v1.lol.html" },
  { name: "2048", cat: "puzzle", url: "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/2048.html" },
  { name: "2048 Cupcakes", cat: "puzzle", url: "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/2048cupcakes.html" },

const CAT_ICONS = {
  action: "⚔️", platformer: "🏃", puzzle: "🧩", racing: "🏎️",
  shooting: "🔫", sports: "⚽", strategy: "🏰", simulation: "🎭",
  horror: "👻", io: "🌐", idle: "💰", minecraft: "⛏️"
};

const CAT_GRADIENTS = {
  action:     "linear-gradient(135deg,#3d0010,#7a0020)",
  platformer: "linear-gradient(135deg,#3d1a00,#7a3800)",
  puzzle:     "linear-gradient(135deg,#2d2600,#5a4c00)",
  racing:     "linear-gradient(135deg,#003040,#006080)",
  shooting:   "linear-gradient(135deg,#3d0000,#7a0000)",
  sports:     "linear-gradient(135deg,#003010,#006020)",
  strategy:   "linear-gradient(135deg,#1a0040,#400090)",
  simulation: "linear-gradient(135deg,#3d0030,#7a0060)",
  horror:     "linear-gradient(135deg,#1a0000,#3d0000)",
  io:         "linear-gradient(135deg,#003030,#006060)",
  idle:       "linear-gradient(135deg,#302000,#604000)",
  minecraft:  "linear-gradient(135deg,#0a2000,#154000)",
};

const FEATURED_NAMES = [
  "Slope", "Run 3", "Happy Wheels", "Geometry Dash", "Flappy Bird",
  "Among Us", "Cookie Clicker", "Retro Bowl", "OvO", "Bloons Tower Defense 5",
  "Moto X3M", "Pac-Man", "2048", "Plants vs Zombies", "Minecraft 1.12"
];

const CAT_LABELS = {
  action: "Action", platformer: "Platformer", puzzle: "Puzzle", racing: "Racing",
  shooting: "Shooting", sports: "Sports", strategy: "Strategy", simulation: "Simulation",
  horror: "Horror", io: ".io Games", idle: "Idle/Clicker", minecraft: "Minecraft"
};

// Persistence
let favorites = new Set(JSON.parse(localStorage.getItem("arcade_favs") || "[]"));
let recentlyPlayed = JSON.parse(localStorage.getItem("arcade_recent") || "[]");
function saveFavorites() { localStorage.setItem("arcade_favs", JSON.stringify([...favorites])); }
function saveRecent()    { localStorage.setItem("arcade_recent", JSON.stringify(recentlyPlayed)); }

const cats = ["all", "favorites", ...Object.keys(CAT_LABELS)];
let activeFilter = "all";
let searchQuery = "";
let sortOrder = "default";

const filtersEl = document.getElementById("filters");
const gridEl    = document.getElementById("grid");
const statsEl   = document.getElementById("stats");

const catCounts = {};
GAMES.forEach(g => { catCounts[g.cat] = (catCounts[g.cat] || 0) + 1; });

cats.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "filter-btn" + (cat === "all" ? " active" : "");
  if (cat === "all")       btn.textContent = `All Games (${GAMES.length})`;
  else if (cat === "favorites") btn.textContent = `❤️ Favorites`;
  else btn.textContent = `${CAT_ICONS[cat] || ""} ${CAT_LABELS[cat]} (${catCounts[cat] || 0})`;
  btn.dataset.cat = cat;
  btn.addEventListener("click", () => {
    activeFilter = cat;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
  filtersEl.appendChild(btn);
});

document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value.toLowerCase();
  render();
});

document.getElementById("sort-select").addEventListener("change", e => {
  sortOrder = e.target.value;
  render();
});

let filteredGames = [];

function render() {
  kbIdx = -1;
  filteredGames = GAMES.filter(g => {
    if (activeFilter === "favorites") return favorites.has(g.name);
    const matchCat = activeFilter === "all" || g.cat === activeFilter;
    const matchSearch = !searchQuery || g.name.toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  });

  if (sortOrder === "az") filteredGames = [...filteredGames].sort((a, b) => a.name.localeCompare(b.name));
  else if (sortOrder === "za") filteredGames = [...filteredGames].sort((a, b) => b.name.localeCompare(a.name));

  statsEl.textContent = `${filteredGames.length} game${filteredGames.length !== 1 ? "s" : ""} found`;

  if (filteredGames.length === 0) {
    gridEl.innerHTML = activeFilter === "favorites"
      ? '<div class="empty">No favorites yet — click ❤️ on any game to save it!</div>'
      : '<div class="empty">No games found. Try a different search!</div>';
    return;
  }

  gridEl.innerHTML = filteredGames.map((g, i) => {
    const isFav = favorites.has(g.name);
    const safeName = g.name.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
    const grad = CAT_GRADIENTS[g.cat] || "linear-gradient(135deg,#1a1a35,#2a2a55)";
    return `
    <div class="card${isFav ? " favorited" : ""}" data-idx="${i}">
      <button class="fav-btn" data-name="${safeName}" title="${isFav ? "Remove from favorites" : "Add to favorites"}">${isFav ? "❤️" : "🤍"}</button>
      <div class="card-thumb" style="background:${grad}">
        <span style="filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5))">${CAT_ICONS[g.cat] || "🎮"}</span>
        <div class="play-overlay">▶ Play</div>
      </div>
      <div class="card-info">
        <div class="card-name">${g.name}</div>
        <span class="cat-badge cat-${g.cat}">${CAT_LABELS[g.cat] || g.cat}</span>
      </div>
    </div>`;
  }).join("");
}

gridEl.addEventListener("click", e => {
  const favBtn = e.target.closest(".fav-btn");
  if (favBtn) {
    e.stopPropagation();
    const name = favBtn.dataset.name;
    if (favorites.has(name)) favorites.delete(name); else favorites.add(name);
    saveFavorites();
    render();
    return;
  }
  const card = e.target.closest(".card[data-idx]");
  if (!card) return;
  const g = filteredGames[card.dataset.idx];
  if (g) openGame(g.name, g.url, g.cat);
});

function renderRecentlyPlayed() {
  const wrap = document.getElementById("recently-played-wrap");
  const container = document.getElementById("recently-played");
  if (!recentlyPlayed.length) { wrap.style.display = "none"; return; }
  wrap.style.display = "";
  container.innerHTML = recentlyPlayed.map(g => {
    const safeName = g.name.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
    return `<div class="recent-card" data-name="${safeName}">
      <div class="card-icon" style="font-size:1.5rem">${CAT_ICONS[g.cat] || "🎮"}</div>
      <div class="card-name">${g.name}</div>
      <span class="cat-badge cat-${g.cat}" style="font-size:0.62rem">${CAT_LABELS[g.cat] || g.cat}</span>
    </div>`;
  }).join("");
}

document.getElementById("recently-played").addEventListener("click", e => {
  const card = e.target.closest(".recent-card");
  if (!card) return;
  const g = GAMES.find(x => x.name === card.dataset.name);
  if (g) openGame(g.name, g.url, g.cat);
});

// ── Featured games ──
function renderFeatured() {
  const row = document.getElementById("featured-row");
  const games = FEATURED_NAMES.map(n => GAMES.find(g => g.name === n)).filter(Boolean);
  row.innerHTML = games.map(g => {
    const grad = CAT_GRADIENTS[g.cat] || "linear-gradient(135deg,#1a1a35,#2a2a55)";
    const safeName = g.name.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
    return `<div class="featured-card" data-name="${safeName}">
      <span class="featured-badge">⭐ Featured</span>
      <div class="card-thumb" style="background:${grad}">
        <span style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))">${CAT_ICONS[g.cat] || "🎮"}</span>
        <div class="play-overlay">▶ Play</div>
      </div>
      <div class="card-info">
        <div class="card-name">${g.name}</div>
        <span class="cat-badge cat-${g.cat}" style="font-size:0.62rem">${CAT_LABELS[g.cat]}</span>
      </div>
    </div>`;
  }).join("");
}

document.getElementById("featured-row").addEventListener("click", e => {
  const card = e.target.closest(".featured-card");
  if (!card) return;
  const g = GAMES.find(x => x.name === card.dataset.name);
  if (g) openGame(g.name, g.url, g.cat);
});

// ── Light / dark mode ──
const themeBtn = document.getElementById("theme-btn");
const savedTheme = localStorage.getItem("arcade_theme");
if (savedTheme === "light") { document.body.classList.add("light"); themeBtn.textContent = "☀️"; }

themeBtn.addEventListener("click", () => {
  const isLight = document.body.classList.toggle("light");
  themeBtn.textContent = isLight ? "☀️" : "🌙";
  localStorage.setItem("arcade_theme", isLight ? "light" : "dark");
});

// ── Share button ──
let currentGameName = "";
document.getElementById("share-btn").addEventListener("click", () => {
  const base = location.href.split("?")[0];
  const url = `${base}?game=${encodeURIComponent(currentGameName)}`;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById("share-btn");
    btn.textContent = "✓ Copied!";
    setTimeout(() => btn.textContent = "🔗 Share", 2000);
  });
});

// ── Keyboard shortcuts ──
let kbIdx = -1;

function updateKbFocus(cards) {
  cards.forEach((c, i) => c.classList.toggle("kb-focused", i === kbIdx));
  if (kbIdx >= 0) cards[kbIdx]?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

document.addEventListener("keydown", e => {
  if (modal.classList.contains("open")) return;

  // / → focus search
  if (e.key === "/" && document.activeElement !== document.getElementById("search")) {
    e.preventDefault();
    document.getElementById("search").focus();
    return;
  }

  if (["ArrowRight","ArrowLeft","ArrowDown","ArrowUp","Enter"].includes(e.key)) {
    const cards = [...gridEl.querySelectorAll(".card[data-idx]")];
    if (!cards.length) return;

    if (e.key === "Enter" && kbIdx >= 0) {
      const g = filteredGames[kbIdx];
      if (g) openGame(g.name, g.url, g.cat);
      return;
    }

    e.preventDefault();
    if (e.key === "ArrowRight" || e.key === "ArrowDown")
      kbIdx = Math.min(kbIdx + 1, cards.length - 1);
    else
      kbIdx = Math.max(kbIdx - 1, 0);

    updateKbFocus(cards);
  }
});

const modal = document.getElementById("modal");
const gameFrame = document.getElementById("game-frame");
const modalTitle = document.getElementById("modal-title");
const modalLoading = document.getElementById("modal-loading");
const loadingLabel = document.getElementById("loading-label");
const openTabBtn = document.getElementById("open-tab-btn");
const modalSpinner = document.getElementById("modal-spinner");
let currentBlobUrl = null;
let currentGameUrl = null;

openTabBtn.addEventListener("click", () => {
  window.open(currentGameUrl, "_blank");
  closeGame();
});

async function openGame(name, url, cat) {
  // Track recently played
  recentlyPlayed = recentlyPlayed.filter(r => r.name !== name);
  recentlyPlayed.unshift({ name, url, cat });
  if (recentlyPlayed.length > 8) recentlyPlayed = recentlyPlayed.slice(0, 8);
  saveRecent();
  renderRecentlyPlayed();

  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  modalTitle.textContent = (CAT_ICONS[cat] || "🎮") + "  " + name;
  currentGameUrl = url;
  currentGameName = name;
  kbIdx = -1;

  // Reset loading UI
  modalLoading.classList.remove("hidden");
  modalSpinner.style.display = "";
  loadingLabel.textContent = "Loading game…";
  loadingLabel.style.color = "";
  openTabBtn.style.display = "none";
  gameFrame.src = "";
  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const html = await res.text();
    const blob = new Blob([html], { type: "text/html" });
    currentBlobUrl = URL.createObjectURL(blob);
    gameFrame.onload = () => modalLoading.classList.add("hidden");
    gameFrame.src = currentBlobUrl;
  } catch (err) {
    console.error("Game load error:", err);
    modalSpinner.style.display = "none";
    loadingLabel.style.color = "#ff6b6b";
    loadingLabel.textContent = `Failed to load (${err.message}) — try opening in a new tab instead.`;
    openTabBtn.style.display = "";
  }
}

function closeGame() {
  modal.classList.remove("open");
  gameFrame.src = "";
  document.body.style.overflow = "";
}

function toggleFullscreen() {
  const wrap = document.getElementById("modal-frame-wrap");
  if (!document.fullscreenElement) {
    wrap.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modal.classList.contains("open")) closeGame();
});

// ── URL share param: auto-open game if ?game= is present ──
const shareParam = new URLSearchParams(location.search).get("game");
if (shareParam) {
  const g = GAMES.find(x => x.name === shareParam);
  if (g) setTimeout(() => openGame(g.name, g.url, g.cat), 300);
}

render();
renderRecentlyPlayed();
renderFeatured();
</script>
